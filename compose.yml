# Local development environment: identity-service, PostgreSQL and Kafka (DOC-ARQ-13).
#
#   docker compose up -d      start them
#   docker compose down       stop them (add -v to also delete the data)
#
# The values below are for local development only and are not secrets. Override any of them with
# environment variables or a local .env file (see .env.example); .env is never committed.
# Keep the image versions in line with the Testcontainers tests in the services.
#
# The group is called "mentora-local" and its containers "mentora-postgres" and "mentora-kafka",
# so they are easy to find in Docker Desktop and in `docker ps`.
name: mentora-local

services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: mentorapredict/identity-service:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${IDENTITY_PORT:-8081}:8080"

  postgres:
    image: postgres:17-alpine
    container_name: mentora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentora}
      POSTGRES_DB: ${POSTGRES_DB:-mentora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the roles svc_migrator and svc_app. PostgreSQL runs it only when the data volume is
      # empty: after changing it, recreate the database with `docker compose down -v`.
      - ./infra/local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: mentora-kafka
    # Single node in KRaft mode (no ZooKeeper), reachable from the host on localhost.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  kafka-data:
