# Single version catalog for the whole monorepo.
# Every service and library reads its versions from here (libs.<name>).
# Spring Boot 4.2 is the starting version of the service framework (DOC-ARQ-13 v1.2.1).

[versions]
java = "21"
spring-boot = "4.2.0"
archunit = "1.5.1"
testcontainers = "2.0.5"
openapi-generator = "7.27.0"
springdoc = "3.2.1"
jacoco = "0.8.13"
checkstyle = "10.26.1"
spotbugs-plugin = "6.2.5"
errorprone-plugin = "4.3.0"
errorprone = "2.41.0"
nullaway = "0.12.10"
spotless-plugin = "7.2.1"
google-java-format = "1.28.0"
jspecify = "1.0.0"

[libraries]
# Gradle plugins used by build-logic (convention plugins)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }

# Compiler checks (DOC-CAL-08 section 2.1): Error Prone with NullAway, null-marked packages with JSpecify
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Architecture and integration tests
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
