# Common configuration of every environment. The environment is chosen with the Spring profile
# (SPRING_PROFILES_ACTIVE=dev|qa|prod), which loads application-<profile>.yml on top of this file.
#
# This repository is public: never write passwords, tokens or AWS account IDs in these files.
# Sensitive values come from environment variables, for example: password: ${DB_PASSWORD}

spring:
  mvc:
    problemdetails:
      enabled: true # errors as application/problem+json (DOC-ARQ-09)
  application:
    name: sample-service
  threads:
    virtual:
      enabled: true # Java 21 virtual threads
  # Two database roles (DOC-ARQ-06 section 5.2). The service runs with a role that cannot skip
  # row-level security; only Flyway uses the role that changes tables.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    # Direct connection to the writer instance: do not go through PgBouncer in transaction mode.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    clean-disabled: true # `flyway clean` deletes the database objects
    validate-migration-naming: true # a badly named script stops the startup

# Health checks (DOC-INF-03 section 5.4). They are operational routes for the platform, not part
# of the business API, so they have no /v1 prefix.
management:
  endpoints:
    web:
      exposure:
        include: health,info # nothing else is reachable over HTTP
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        # liveness: "is the process stuck?". It must not check the database or other services,
        # so an external failure does not restart the pods.
        liveness:
          include: livenessState
        # readiness: "can it receive traffic?". It includes the dependencies the service cannot
        # work without: here, the database. Add the broker if yours needs it.
        readiness:
          include: readinessState,db
